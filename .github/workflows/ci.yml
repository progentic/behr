name: BeHR CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: behr_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: behr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U behr_ci -d behr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_PORT: 3000
      ADMIN_ORIGIN: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://behr_ci:ci-only-password@127.0.0.1:5432/behr_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate operational shell syntax
        run: |
          bash -n infra/scripts/install-preflight.sh
          bash -n infra/scripts/provision-host.sh
          bash -n infra/scripts/backup.sh
          bash -n infra/scripts/restore.sh
          bash -n infra/scripts/deploy.sh
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Generate ephemeral authentication secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check workspaces
        run: bun run typecheck
      - name: Run unit tests
        run: bun run test
      - name: Check database connectivity
        run: bun run db:check
      - name: Validate migration history
        run: bun run db:migration:check
      - name: Run migrations
        run: bun run db:migrate
      - name: Verify migration idempotency
        run: bun run db:migrate
      - name: Run persistence integration tests
        run: bun run test:integration
      - name: Run authentication integration tests
        run: bun run test:auth:integration
      - name: Run tenant integration tests
        run: bun run test:tenant:integration
      - name: Run site integration tests
        run: bun run test:site:integration
      - name: Run membership integration tests
        run: bun run test:membership:integration
      - name: Run page integration tests
        run: bun run test:page:integration
      - name: Run public integration tests
        run: bun run test:public:integration
      - name: Run preview integration tests
        run: bun run test:preview:integration
      - name: Run publish integration tests
        run: bun run test:publish:integration
      - name: Run asset integration tests
        run: bun run test:asset:integration
      - name: Build workspaces
        run: bun run build
      - name: Audit dependencies
        run: bun audit
