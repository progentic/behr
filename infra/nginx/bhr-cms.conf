log_format bhr_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent host=$host duration=$request_time';

map $request_method $bhr_auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $bhr_auth_limit_key zone=bhr_auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __BHR_ADMIN_HOST__;

    ssl_certificate /etc/bhr-cms/tls/fullchain.pem;
    ssl_certificate_key /etc/bhr-cms/tls/privkey.pem;

    root /opt/bhr-cms/apps/admin/dist;
    index index.html;
    client_max_body_size 11m;

    access_log /var/log/nginx/bhr-cms-access.log bhr_access;
    error_log /var/log/nginx/bhr-cms-error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    location = /health {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/login {
        limit_req zone=bhr_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/register {
        limit_req zone=bhr_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /tenants {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /tenants/ {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /public/ {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /preview/ {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/bhr-cms/tls/fullchain.pem;
    ssl_certificate_key /etc/bhr-cms/tls/privkey.pem;

    root /opt/bhr-cms/apps/web/dist;
    index index.html;

    access_log /var/log/nginx/bhr-cms-access.log bhr_access;
    error_log /var/log/nginx/bhr-cms-error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /health {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /public/ {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /preview/ {
        proxy_pass http://127.0.0.1:__BHR_API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth { return 404; }
    location /auth/ { return 404; }
    location = /tenants { return 404; }
    location /tenants/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
